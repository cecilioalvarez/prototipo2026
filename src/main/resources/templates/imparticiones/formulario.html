<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${imparticionId} ? 'Editar impartición' : 'Nueva impartición')}"></head>
<body>
	<nav th:replace="~{fragments/layout :: navbar}"></nav>

	<main class="container">
		<nav aria-label="breadcrumb">
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a th:href="@{/cursos}">Cursos</a></li>
				<li class="breadcrumb-item">
					<a th:href="@{/cursos/{id}/imparticiones(id=${curso.id})}" th:text="${curso.titulo}">Curso</a>
				</li>
				<li class="breadcrumb-item active" aria-current="page"
					th:text="${imparticionId} ? 'Editar impartición' : 'Nueva impartición'">Nueva impartición</li>
			</ol>
		</nav>

		<div class="row justify-content-center">
			<div class="col-md-8 col-lg-6">
				<div class="card shadow-sm">
					<div class="card-header">
						<h1 class="h4 mb-0" th:text="${imparticionId} ? 'Editar impartición' : 'Nueva impartición'">Nueva impartición</h1>
					</div>
					<div class="card-body">
						<form th:action="${imparticionId} ? @{/cursos/{c}/imparticiones/{i}(c=${curso.id}, i=${imparticionId})} : @{/cursos/{c}/imparticiones(c=${curso.id})}"
							th:object="${imparticionForm}" method="post">

							<div class="mb-3">
								<label for="nombre" class="form-label">Nombre</label>
								<input type="text" id="nombre" th:field="*{nombre}" class="form-control"
									th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" required>
								<div class="invalid-feedback" th:errors="*{nombre}">Error</div>
							</div>

							<div class="row">
								<div class="col-sm-6 mb-3">
									<label for="fechaInicio" class="form-label">Fecha inicio</label>
									<input type="date" id="fechaInicio" th:field="*{fechaInicio}" class="form-control"
										th:classappend="${#fields.hasErrors('fechaInicio')} ? 'is-invalid'" required>
									<div class="invalid-feedback" th:errors="*{fechaInicio}">Error</div>
								</div>
								<div class="col-sm-6 mb-4">
									<label for="fechaFin" class="form-label">Fecha fin</label>
									<input type="date" id="fechaFin" th:field="*{fechaFin}" class="form-control"
										th:classappend="${#fields.hasErrors('fechaFin')} ? 'is-invalid'" required>
									<div class="invalid-feedback" th:errors="*{fechaFin}">Error</div>
								</div>
							</div>

							<div class="d-flex justify-content-end gap-2">
								<a th:href="@{/cursos/{id}/imparticiones(id=${curso.id})}" class="btn btn-outline-secondary">Cancelar</a>
								<button type="submit" class="btn btn-primary">Guardar</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
