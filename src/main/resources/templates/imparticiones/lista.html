<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Imparticiones')}"></head>
<body>
	<nav th:replace="~{fragments/layout :: navbar}"></nav>

	<main class="container">
		<nav aria-label="breadcrumb">
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a th:href="@{/cursos}">Cursos</a></li>
				<li class="breadcrumb-item active" aria-current="page" th:text="${curso.titulo}">Curso</li>
			</ol>
		</nav>

		<div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${mensaje}">Mensaje</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
		</div>

		<div class="card shadow-sm">
			<div class="card-header d-flex justify-content-between align-items-center">
				<div class="d-flex align-items-center gap-2">
					<h1 class="h4 mb-0">Imparticiones de <span th:text="${curso.titulo}">curso</span></h1>
					<span class="badge bg-secondary" th:text="${#lists.size(imparticiones)}">0</span>
				</div>
				<a th:href="@{/cursos/{id}/imparticiones/nueva(id=${curso.id})}" class="btn btn-primary btn-sm">Añadir impartición</a>
			</div>
			<div class="card-body">
				<div th:if="${#lists.isEmpty(imparticiones)}" class="alert alert-info mb-0" role="alert">
					Este curso no tiene imparticiones.
				</div>

				<div th:unless="${#lists.isEmpty(imparticiones)}" class="table-responsive">
					<table class="table table-striped table-hover align-middle mb-0">
						<thead class="table-light">
							<tr>
								<th scope="col">Nombre</th>
								<th scope="col">Fecha inicio</th>
								<th scope="col">Fecha fin</th>
								<th scope="col" class="text-end">Acciones</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="imparticion : ${imparticiones}">
								<td th:text="${imparticion.nombre}"></td>
								<td th:text="${#temporals.format(imparticion.fechaInicio, 'dd/MM/yyyy')}"></td>
								<td th:text="${#temporals.format(imparticion.fechaFin, 'dd/MM/yyyy')}"></td>
								<td class="text-end">
									<div class="d-inline-flex gap-1">
										<a th:href="@{/cursos/{c}/imparticiones/{i}/editar(c=${curso.id}, i=${imparticion.id})}"
											class="btn btn-outline-primary btn-sm">Editar</a>
										<form th:action="@{/cursos/{c}/imparticiones/{i}/borrar(c=${curso.id}, i=${imparticion.id})}"
											method="post" onsubmit="return confirm('¿Seguro que quieres borrar esta impartición?');">
											<button type="submit" class="btn btn-outline-danger btn-sm">Borrar</button>
										</form>
									</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
			<div class="card-footer">
				<a th:href="@{/cursos}" class="btn btn-outline-secondary btn-sm">Volver a cursos</a>
			</div>
		</div>
	</main>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
