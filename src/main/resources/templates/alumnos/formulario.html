<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo alumno')}"></head>
<body>
	<nav th:replace="~{fragments/layout :: navbar}"></nav>

	<main class="container">
		<div class="row justify-content-center">
			<div class="col-md-8 col-lg-6">
				<div class="card shadow-sm">
					<div class="card-header">
						<h1 class="h4 mb-0">Nuevo alumno</h1>
					</div>
					<div class="card-body">
						<form th:action="@{/alumnos}" th:object="${alumnoForm}" method="post">

							<div class="mb-3">
								<label for="dni" class="form-label">DNI</label>
								<input type="text" id="dni" th:field="*{dni}" class="form-control" maxlength="9"
									pattern="\s*[0-9]{8}[A-Za-z]\s*" title="8 números y una letra, por ejemplo 12345678Z"
									placeholder="12345678Z"
									th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid'" required>
								<div class="invalid-feedback" th:errors="*{dni}">Error</div>
							</div>

							<div class="mb-3">
								<label for="nombre" class="form-label">Nombre</label>
								<input type="text" id="nombre" th:field="*{nombre}" class="form-control"
									th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" required>
								<div class="invalid-feedback" th:errors="*{nombre}">Error</div>
							</div>

							<div class="mb-4">
								<label for="apellidos" class="form-label">Apellidos</label>
								<input type="text" id="apellidos" th:field="*{apellidos}" class="form-control"
									th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid'" required>
								<div class="invalid-feedback" th:errors="*{apellidos}">Error</div>
							</div>

							<div class="d-flex justify-content-end gap-2">
								<a th:href="@{/alumnos}" class="btn btn-outline-secondary">Cancelar</a>
								<button type="submit" class="btn btn-primary">Guardar</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
