<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Listado de cursos')}"></head>
<body>
	<nav th:replace="~{fragments/layout :: navbar}"></nav>

	<main class="container">
		<div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${mensaje}">Mensaje</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
		</div>

		<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<span th:text="${error}">Error</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
		</div>

		<div class="card shadow-sm">
			<div class="card-header d-flex justify-content-between align-items-center">
				<div class="d-flex align-items-center gap-2">
					<h1 class="h4 mb-0">Listado de cursos</h1>
					<span class="badge bg-secondary" th:text="${#lists.size(cursos)} + ' cursos'">0 cursos</span>
				</div>
				<div class="d-flex gap-2">
					<form th:action="@{/cursos/cargar}" method="post" enctype="multipart/form-data" class="m-0">
						<div class="input-group input-group-sm">
							<input type="file" name="fichero" accept=".txt,.csv" class="form-control" required
								aria-label="Fichero de cursos (.txt o .csv)">
							<button type="submit" class="btn btn-outline-secondary">Cargar cursos</button>
						</div>
					</form>
					<a th:href="@{/cursos/nuevo}" class="btn btn-primary btn-sm">Añadir curso</a>
				</div>
			</div>
			<div class="card-body">
				<div th:if="${#lists.isEmpty(cursos)}" class="alert alert-info mb-0" role="alert">
					No hay cursos.
				</div>

				<div th:unless="${#lists.isEmpty(cursos)}" class="table-responsive">
					<table class="table table-striped table-hover align-middle mb-0">
						<thead class="table-light">
							<tr>
								<th scope="col">Id</th>
								<th scope="col">Título</th>
								<th scope="col">Autor</th>
								<th scope="col" class="text-end">Duración</th>
								<th scope="col" class="text-end">Acciones</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="curso : ${cursos}">
								<td th:text="${curso.id}"></td>
								<td th:text="${curso.titulo}"></td>
								<td th:text="${curso.autor}"></td>
								<td class="text-end" th:text="${curso.duracion}"></td>
								<td class="text-end">
									<a th:href="@{/cursos/{id}/imparticiones(id=${curso.id})}"
										class="btn btn-outline-primary btn-sm">Imparticiones</a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
