<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Listado de cursos</title>
</head>
<body>
	<h1>Listado de cursos</h1>

	<p th:if="${#lists.isEmpty(cursos)}">No hay cursos.</p>

	<table th:unless="${#lists.isEmpty(cursos)}" border="1">
		<thead>
			<tr>
				<th>Id</th>
				<th>Título</th>
				<th>Autor</th>
				<th>Duración</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="curso : ${cursos}">
				<td th:text="${curso.id}"></td>
				<td th:text="${curso.titulo}"></td>
				<td th:text="${curso.autor}"></td>
				<td th:text="${curso.duracion}"></td>
			</tr>
		</tbody>
	</table>
</body>
</html>
