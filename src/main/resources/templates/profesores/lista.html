<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Listado de profesores')}"></head>
<body>
	<nav th:replace="~{fragments/layout :: navbar}"></nav>

	<main class="container">
		<div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${mensaje}">Mensaje</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
		</div>

		<div class="card shadow-sm">
			<div class="card-header d-flex justify-content-between align-items-center">
				<div class="d-flex align-items-center gap-2">
					<h1 class="h4 mb-0">Listado de profesores</h1>
					<span class="badge bg-secondary" th:text="${#lists.size(profesores)} + ' profesores'">0 profesores</span>
				</div>
				<a th:href="@{/profesores/nuevo}" class="btn btn-primary btn-sm">Añadir profesor</a>
			</div>
			<div class="card-body">
				<div th:if="${#lists.isEmpty(profesores)}" class="alert alert-info mb-0" role="alert">
					No hay profesores.
				</div>

				<div th:unless="${#lists.isEmpty(profesores)}" class="table-responsive">
					<table class="table table-striped table-hover align-middle mb-0">
						<thead class="table-light">
							<tr>
								<th scope="col">DNI</th>
								<th scope="col">Nombre</th>
								<th scope="col">Apellidos</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="profesor : ${profesores}">
								<td th:text="${profesor.dni}"></td>
								<td th:text="${profesor.nombre}"></td>
								<td th:text="${profesor.apellidos}"></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
